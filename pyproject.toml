[project]
name = "demografie-fetch"
version = "0.0.1"
description = "Demografiedaten fuer die Immobilien-Ampel: URL rein, Tabelle je Kreis raus"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Thorsten Rosin" }]
dependencies = []

[dependency-groups]
probe = ["requests>=2.31", "PyYAML>=6.0", "playwright>=1.45"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-requests", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demografie_fetch"]

[tool.uv]
default-groups = ["probe", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: Tests mit echtem Netzwerkzugriff (standardmaessig aus)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
