[project]
name = "demografie-fetch"
version = "0.1.0"
description = "Demografiedaten fuer die Immobilien-Ampel: URL rein, Tabelle je Kreis raus"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Thorsten Rosin" }]
dependencies = [
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
demografie-fetch = "demografie_fetch.cli:main"

[dependency-groups]
probe = ["requests>=2.31", "PyYAML>=6.0", "playwright>=1.45"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-requests",
    "types-PyYAML",
    "pandas-stubs>=3.0.5.260914",
    "pyarrow-stubs>=20.0.0.20260819",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demografie_fetch"]

[tool.uv]
default-groups = ["probe", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: Tests mit echtem Netzwerkzugriff (standardmaessig aus)"]
addopts = "-m 'not live'"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
