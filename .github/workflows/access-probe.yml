name: access-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten
        run: |
          pip install requests PyYAML playwright
          python -m playwright install --with-deps chromium
      - name: Zugangspruefung
        env:
          GENESIS_TOKEN: ${{ secrets.GENESIS_TOKEN }}
          REGIO_TOKEN: ${{ secrets.REGIO_TOKEN }}
        run: python probe/access_probe.py --env ci
      - uses: actions/upload-artifact@v4
        with:
          name: report_ci
          path: probe/report_ci.json
