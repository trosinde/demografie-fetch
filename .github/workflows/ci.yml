name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-group probe --group dev
      - run: uv run ruff check src tests probe
      - run: uv run --group probe mypy src tests probe
      - run: uv run pytest -q
